name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch. A second push supersedes the first instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # tsup 9 needs Node 22.18+, but the built package still supports Node 20.
          node-version: ${{ matrix.node == 20 && '22' || matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-node@v7
        if: matrix.node == 20
        with:
          node-version: '20'
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ./python
      - run: python python/test_loop.py
