name: Feature request
description: Suggest something grok-loop-kit should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Calls xAI's compaction endpoint with your key and folds the result back into your loop. Transcripts pass through it and are not stored.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
